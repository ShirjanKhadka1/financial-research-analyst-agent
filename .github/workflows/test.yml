# Phase 7: OS x Python matrix + quality gates.
# Matrix job (pytest only) runs on Linux/macOS/Windows — the
# macos/windows combinations are CI-only: never run locally,
# their first GitHub run is the proof. Quality and smoke jobs
# stay on ubuntu-latest. All CI dependencies pinned to
# versions measured 28 Oct 2026.
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "pytest==9.2.0"
      - run: python -m pytest tests/ -q
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.17.3" "mypy==2.4.0"
      - run: ruff check analyst/ tests/
      - run: mypy analyst/
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m analyst.cli demo
