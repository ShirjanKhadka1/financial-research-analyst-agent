# =====================================================================
# NOT DEPLOYED — STAGED FILE ONLY (Phase 4, 7 Nov 2026).
# This workflow is NOT live on GitHub. It was prepared locally and has
# NOT been pushed via the API: the token behind the API helper lacks
# workflow scope, so an API push of a .github/workflows/ file would
# fail with 403. The parent deploys it via the GitHub web UI (browser
# route) and then confirms the file exists on main and the first run
# is observed green (or red, triaged honestly).
# Do NOT describe this workflow as deployed, running, or green until
# the parent confirms that deployment and a run.
#
# TARGET:
#   Repo:   ShirjanKhadka1/financial-research-analyst-agent
#   Branch: main
#   Path:   .github/workflows/test.yml   (UPDATE — replaces the Phase 7 file)
#
# Change vs the live Phase 7 file: the quality job no longer runs the
# individual ruff/mypy commands; it installs the pinned dev tools from
# requirements-dev.txt and runs `python scripts/qa.py`, the single
# Phase 4 entry point (tests, lint, typecheck, counts, licence, secret
# scan, link check, fresh-clone demo). Matrix job is unchanged. The
# smoke job is unchanged (analyst demo) — qa.py's fresh-clone gate
# runs the same command from a clean clone, so the two overlap
# deliberately: one proves the checkout, one proves a clone.
# fetch-depth: 0 is deliberate: the secret gate scans `git log -p`,
# and the default shallow checkout would make that scan vacuous.
# =====================================================================
# Phase 7: OS x Python matrix + quality gates.
# Matrix job (pytest only) runs on Linux/macOS/Windows — the
# macos/windows combinations are CI-only: never run locally,
# their first GitHub run is the proof. Quality and smoke jobs
# stay on ubuntu-latest. All CI dependencies pinned to
# versions measured 28 Oct 2026.
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "pytest==9.2.0"
      - run: python -m pytest tests/ -q
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python scripts/qa.py
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m analyst.cli demo
