# Phase 7: mypy guardrail, honest scope (same note as the toolkit).
# Measured 28 Oct 2026: `mypy analyst/` passes under DEFAULT settings
# (mypy 2.4.0, 12 source files, no issues). Default mypy does NOT
# check untyped functions, so this is a guardrail, not a claim of
# full type safety. Full annotations are a follow-up.
[mypy]
python_version = 3.10
warn_unused_ignores = True
